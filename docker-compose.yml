services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resonance}
      POSTGRES_DB: resonance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance -d resonance"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DATABASE_URL: postgresql+asyncpg://resonance:${POSTGRES_PASSWORD:-resonance}@db:5432/resonance
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY in .env}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?set BLIND_INDEX_KEY in .env}
      K_ANON_MIN: ${K_ANON_MIN:-10}
      DAILY_CARD_BUDGET: ${DAILY_CARD_BUDGET:-3}
      FIT_THRESHOLD: ${FIT_THRESHOLD:-85}
      LLM_MODE: ${LLM_MODE:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_SMALL: ${LLM_MODEL_SMALL:-gpt-4o-mini}
      LLM_MODEL_JUDGE: ${LLM_MODEL_JUDGE:-gpt-4o-mini}
      LLM_MODEL_LARGE: ${LLM_MODEL_LARGE:-gpt-4o}
      SEED_ON_START: ${SEED_ON_START:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
